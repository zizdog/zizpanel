# 未在 fnOS 验证：草图，没有在飞牛设备上部署过，路径与 UID 需现场确认。
services:
  zizvideo:
    build: .
    image: zizvideo:0.1.0-mvp
    container_name: zizvideo
    restart: unless-stopped
    ports:
      - "127.0.0.1:7766:7766"
    volumes:
      - /vol1/docker/zizvideo/data:/var/lib/zizvideo
      - /vol1/media:/media:ro
    environment:
      - TZ=Asia/Shanghai
      - ZV_LISTEN=0.0.0.0:7766
      - ZV_DATA_DIR=/var/lib/zizvideo
      - ZV_DATABASE_PATH=/var/lib/zizvideo/zizvideo.db
      - ZV_MEDIA_ALLOW_ROOTS=/media
      - ZV_FFMPEG_BIN=/usr/bin/ffmpeg
      - ZV_FFPROBE_BIN=/usr/bin/ffprobe
      - ZV_LOG_LEVEL=info
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7766/healthz | grep -q ok || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
