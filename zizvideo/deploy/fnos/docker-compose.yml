# 未在 fnOS 验证：草图，没有在飞牛设备上部署过，路径与 UID 需现场确认。
services:
  govideo:
    build: .
    image: govideo:0.1.0-mvp
    container_name: govideo
    restart: unless-stopped
    ports:
      - "127.0.0.1:7766:7766"
    volumes:
      - /vol1/docker/govideo/data:/var/lib/govideo
      - /vol1/media:/media:ro
    environment:
      - TZ=Asia/Shanghai
      - GV_LISTEN=0.0.0.0:7766
      - GV_DATA_DIR=/var/lib/govideo
      - GV_DATABASE_PATH=/var/lib/govideo/govideo.db
      - GV_MEDIA_ALLOW_ROOTS=/media
      - GV_FFMPEG_BIN=/usr/bin/ffmpeg
      - GV_FFPROBE_BIN=/usr/bin/ffprobe
      - GV_LOG_LEVEL=info
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7766/healthz | grep -q ok || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
