<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mac军刀 · macOS 原生小工具</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="brand" id="brand">mac军刀</div>
  <div class="meta">
    <span id="whoami"></span>
    <button type="button" class="ghost hidden" id="btn-logout">退出</button>
  </div>
</header>

<main class="wrap">
  <!-- 未初始化 / 未登录 -->
  <section id="screen-auth" class="card narrow">
    <h2 id="auth-title">初始化</h2>
    <p class="hint" id="auth-hint">首次使用请设置本机用户名与口令。</p>
    <form id="form-auth" autocomplete="off">
      <label class="fld"><span>用户名</span>
        <input name="user" type="text" required minlength="3" autocomplete="username">
      </label>
      <label class="fld"><span>口令</span>
        <input name="password" type="password" required minlength="8" autocomplete="current-password">
      </label>
      <label class="fld hidden" id="fld-confirm"><span>再输一次</span>
        <input name="confirm" type="password" autocomplete="new-password">
      </label>
      <button class="primary" type="submit" id="btn-auth">建立</button>
    </form>
  </section>

  <!-- 主界面 -->
  <section id="screen-app" class="hidden">
    <nav class="cats" id="cats"></nav>
    <div class="stage">
      <div id="tool-panel"></div>
      <div id="result-panel"></div>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
<script type="module" src="/app.js?v=1"></script>
</body>
</html>
