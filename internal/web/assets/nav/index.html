<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto" data-size="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>导航页 · ZizPanel</title>
<!--
  独立别名页（浏览器首页）：GET /nav/

  为什么这份页面是**自包含**的（自带样式，不引用面板的 /js/ui.js 与 /app.css）：
  它注册在面板安全后缀**之外**（外层 mux，见 internal/web/api_nav.go），
  匿名访问者拿不到后缀之下的任何资源 —— 引用面板资源会导致未登录时白屏。

  观感照抄用户给的参考首页（2026-09-18 要求）：
    · 毛玻璃卡片（backdrop-filter blur+saturate、半透明底、渐变边框、hover 抬升 + 顶部扫光）；
    · 渐变背景 + 两个漂移光晕（.bg 双缓冲交叉淡入 + .orb drift1/drift2）；
    · 外观模式 auto/light/dark、8 套主题色系、卡片尺寸 s/m/l。
  外观的**默认值**来自服务端 nav_settings（随公开的 ./data 下发），
  访客在这一页用右上角 ⚙ 做的选择存在 localStorage，只影响本机这次浏览。
-->
<style>
  /* ===================== 基础变量 ===================== */
  * { box-sizing: border-box; }
  :root { /* 默认 = 暗色外观 */
    --text: #eef0ff;
    --text-dim: rgba(238,240,255,.62);
    --text-mute: rgba(238,240,255,.42);
    --card-bg: rgba(255,255,255,.07);
    --card-bg-hover: rgba(255,255,255,.13);
    --card-bd: rgba(255,255,255,.12);
    --icon-bg: rgba(255,255,255,.10);
    --icon-bg-hover: rgba(255,255,255,.18);
    --shadow: 0 10px 30px rgba(0,0,0,.45);
    --shadow-hover: 0 18px 44px rgba(0,0,0,.55);
    --panel-bg: rgba(16,16,28,.45);
    --panel-bd: rgba(255,255,255,.14);
    --chip: rgba(255,255,255,.08);
    --chip-active: rgba(255,255,255,.22);
    --cat-bd: rgba(255,255,255,.45);
    --accent: #8b5cf6;      /* 由 JS 按 色系/自定义主题色 覆盖 */
    --accent-soft: rgba(139,92,246,.16);
    --orb1: #8b5cf6;
    --orb2: #22d3ee;
    --orb-op: .40;
    --orb-size: 46vmax;
  }
  html[data-theme="light"] {
    --text: #1b1b2f;
    --text-dim: rgba(27,27,47,.60);
    --text-mute: rgba(27,27,47,.42);
    --card-bg: rgba(255,255,255,.55);
    --card-bg-hover: rgba(255,255,255,.80);
    --card-bd: rgba(255,255,255,.70);
    --icon-bg: rgba(255,255,255,.50);
    --icon-bg-hover: rgba(255,255,255,.92);
    --shadow: 0 8px 24px rgba(31,38,135,.10);
    --shadow-hover: 0 16px 36px rgba(31,38,135,.16);
    --panel-bg: rgba(255,255,255,.52);
    --panel-bd: rgba(255,255,255,.75);
    --chip: rgba(255,255,255,.40);
    --chip-active: rgba(255,255,255,.95);
    --cat-bd: rgba(27,27,47,.30);
    --orb-op: .30;
  }
  @media (prefers-color-scheme: light) {
    html[data-theme="auto"] {
      --text: #1b1b2f;
      --text-dim: rgba(27,27,47,.60);
      --text-mute: rgba(27,27,47,.42);
      --card-bg: rgba(255,255,255,.55);
      --card-bg-hover: rgba(255,255,255,.80);
      --card-bd: rgba(255,255,255,.70);
      --icon-bg: rgba(255,255,255,.50);
      --icon-bg-hover: rgba(255,255,255,.92);
      --shadow: 0 8px 24px rgba(31,38,135,.10);
      --shadow-hover: 0 16px 36px rgba(31,38,135,.16);
      --panel-bg: rgba(255,255,255,.52);
      --panel-bd: rgba(255,255,255,.75);
      --chip: rgba(255,255,255,.40);
      --chip-active: rgba(255,255,255,.95);
      --cat-bd: rgba(27,27,47,.30);
      --orb-op: .30;
    }
  }

  html, body { margin: 0; min-height: 100%; }
  body {
    color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 20px 60px;
    transition: color .4s ease;
  }

  /* ===================== 渐变背景（双缓冲交叉淡入）+ 光晕 ===================== */
  .bg { position: fixed; inset: 0; z-index: -4; opacity: 0; transition: opacity .7s ease; }
  .bg.on { opacity: 1; }
  .userbg {
    position: fixed; inset: 0; z-index: -3; pointer-events: none;
    background-size: cover; background-position: center; background-repeat: no-repeat;
  }
  .glow { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; }
  .orb {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: var(--orb-op);
    width: var(--orb-size); height: var(--orb-size);
    transition: background-color .9s ease, opacity .6s ease;
  }
  .orb.a { background: var(--orb1); top: -14vmax; left: -10vmax; animation: drift1 26s ease-in-out infinite; }
  .orb.b { background: var(--orb2); right: -12vmax; bottom: -14vmax; animation: drift2 32s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(6vmax,4vmax) scale(1.12); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-5vmax,-4vmax) scale(1.15); } }

  /* ===================== 顶部 ===================== */
  .wrap { max-width: 1180px; margin: 0 auto; }
  header { padding: 56px 0 20px; text-align: center; }
  .clock { font-size: 13px; letter-spacing: .14em; color: var(--text-dim); margin-bottom: 10px; }
  h1 { font-size: 2.4em; font-weight: 250; letter-spacing: .06em; margin: 0;
       text-shadow: 0 2px 14px rgba(0,0,0,.25); }
  .sub { margin-top: 8px; font-size: .95em; color: var(--text-dim); min-height: 1.2em; }
  .search {
    max-width: 420px; margin: 26px auto 0; display: flex; align-items: center; gap: 8px;
    background: var(--card-bg); border: 1px solid var(--card-bd); border-radius: 999px;
    padding: 10px 18px;
    backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%);
    box-shadow: var(--shadow); transition: background .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .search:focus-within { background: var(--card-bg-hover); border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
  .search input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 14px; }
  .search input::placeholder { color: var(--text-dim); }

  /* ===================== 卡片 ===================== */
  section.group { margin-top: 38px; }
  .group-head { display: flex; align-items: center; gap: 9px; margin: 0 0 16px; }
  .group-head h2 {
    margin: 0; font-size: 1.12em; font-weight: 400; padding-left: 12px;
    border-left: 3px solid var(--accent); color: var(--text);
  }
  .group-head .count { font-size: 11.5px; color: var(--text-mute); }
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  a.card {
    position: relative; overflow: hidden; text-decoration: none; color: var(--text);
    background: var(--card-bg); border: 1px solid var(--card-bd);
    backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%);
    border-radius: 18px; padding: 16px 18px;
    display: flex; align-items: center; gap: 14px; text-align: left;
    box-shadow: var(--shadow);
    transition: transform .32s cubic-bezier(.34,1.4,.5,1), background .3s ease, box-shadow .3s ease, border-color .3s ease;
  }
  a.card::after { /* 顶部扫光 */
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent);
    transform: translateX(-100%); transition: transform .6s ease;
  }
  a.card:hover { text-decoration: none; transform: translateY(-6px); background: var(--card-bg-hover);
    box-shadow: var(--shadow-hover); border-color: color-mix(in srgb, var(--card-bd) 40%, var(--accent)); }
  a.card:hover::after { transform: translateX(100%); }
  .icon {
    flex: 0 0 auto; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
    font-size: 26px; background: var(--icon-bg); border-radius: 15px; object-fit: contain;
    transition: transform .35s cubic-bezier(.34,1.4,.5,1), background .3s ease;
  }
  img.icon { background: transparent; }
  a.card:hover .icon { transform: scale(1.10) rotate(-4deg); background: var(--icon-bg-hover); }
  .meta { flex: 1; min-width: 0; }
  .name { font-size: 1.02em; font-weight: 500; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc { font-size: .78em; color: var(--text-dim); line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* ---- 尺寸：小 / 中 / 大 ---- */
  html[data-size="s"] .grid { grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap: 12px; }
  html[data-size="s"] a.card { padding: 11px 14px; border-radius: 14px; gap: 11px; }
  html[data-size="s"] .icon { width: 38px; height: 38px; font-size: 19px; border-radius: 11px; }
  html[data-size="s"] .name { font-size: .90em; margin-bottom: 2px; }
  html[data-size="s"] .desc { font-size: .70em; -webkit-line-clamp: 1; }

  html[data-size="m"] .grid { grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 18px; }
  html[data-size="m"] a.card { padding: 16px 18px; border-radius: 18px; gap: 14px; }
  html[data-size="m"] .icon { width: 52px; height: 52px; font-size: 26px; border-radius: 15px; }
  html[data-size="m"] .name { font-size: 1.02em; }
  html[data-size="m"] .desc { font-size: .78em; }

  html[data-size="l"] .grid { grid-template-columns: repeat(auto-fill, minmax(340px,1fr)); gap: 24px; }
  html[data-size="l"] a.card { padding: 22px 24px; border-radius: 24px; gap: 18px; }
  html[data-size="l"] .icon { width: 68px; height: 68px; font-size: 34px; border-radius: 20px; }
  html[data-size="l"] .name { font-size: 1.20em; margin-bottom: 6px; }
  html[data-size="l"] .desc { font-size: .86em; }

  .hide { display: none !important; }
  .empty { text-align: center; padding: 70px 20px; color: var(--text-mute); }
  .empty .big { font-size: 38px; opacity: .6; margin-bottom: 10px; }
  .empty h3 { margin: 0 0 6px; color: var(--text-dim); font-size: 15px; }
  .empty p { margin: 0; font-size: 12.5px; }
  footer { text-align: center; margin-top: 60px; font-size: .82em; color: var(--text-mute); }

  /* ===================== 顶部按钮：回面板编辑 / 外观设置 ===================== */
  .edit-link {
    position: fixed; top: 20px; left: 20px; z-index: 60;
    font-size: 12.5px; color: var(--text-dim); text-decoration: none;
    border: 1px solid var(--panel-bd); border-radius: 10px; padding: 9px 13px;
    background: var(--panel-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: var(--shadow);
  }
  .edit-link:hover { color: var(--text); }

  .fab {
    position: fixed; top: 20px; right: 20px; z-index: 60; width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid var(--panel-bd); background: var(--panel-bg); color: var(--text); font-size: 19px;
    cursor: pointer; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: var(--shadow); transition: transform .3s ease, background .3s ease;
  }
  .fab:hover { transform: rotate(45deg) scale(1.06); }

  /* ===================== 设置面板 ===================== */
  .panel {
    position: fixed; top: 76px; right: 20px; z-index: 59; width: 296px;
    background: var(--panel-bg); border: 1px solid var(--panel-bd); border-radius: 20px;
    backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow: var(--shadow); padding: 18px; color: var(--text);
    opacity: 0; transform: translateY(-10px) scale(.97); pointer-events: none;
    transition: opacity .28s ease, transform .28s cubic-bezier(.34,1.3,.5,1);
  }
  .panel.open { opacity: 1; transform: none; pointer-events: auto; }
  .p-sec + .p-sec { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--card-bd); }
  .p-title { font-size: .82em; color: var(--text-dim); margin-bottom: 10px; letter-spacing: .05em; }
  .p-title .hint { opacity: .65; font-size: .9em; }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; padding: 11px 0; border: 1px solid transparent; border-radius: 12px; cursor: pointer;
    background: var(--chip); color: var(--text); font-size: .86em; transition: all .25s ease;
  }
  .seg button:hover { background: var(--chip-active); }
  .seg button.on { background: var(--chip-active); font-weight: 600; box-shadow: var(--shadow);
    border-color: var(--accent); }
  .themes { display: grid; grid-template-columns: repeat(4,1fr); gap: 9px; }
  .sw { cursor: pointer; border: 2px solid transparent; border-radius: 12px; padding: 3px;
    transition: all .25s ease; background: none; }
  .sw:hover { transform: translateY(-2px); }
  .sw.on { border-color: var(--text); }
  .sw .box { height: 34px; border-radius: 9px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  .sw .nm { display: block; text-align: center; font-size: .68em; margin-top: 5px; color: var(--text-dim); }
  .p-reset {
    width: 100%; margin-top: 12px; padding: 9px 0; cursor: pointer; font-size: .8em;
    background: none; color: var(--text-dim); border: 1px dashed var(--card-bd); border-radius: 10px;
  }
  .p-reset:hover { color: var(--text); border-color: var(--text-dim); }

  @media (max-width: 640px) {
    h1 { font-size: 1.8em; }
    header { padding: 40px 0 18px; }
    .panel { right: 12px; left: 12px; width: auto; }
    .fab { top: 12px; right: 12px; }
    .edit-link { top: 12px; left: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bg { transition: none; }
    .orb { animation: none; }
    a.card, .icon, .fab, .sw { transition: none; }
    a.card:hover { transform: none; }
    a.card:hover .icon { transform: none; }
    a.card::after { display: none; }
  }
</style>
</head>
<body>

<div class="bg" id="bgA"></div>
<div class="bg" id="bgB"></div>
<div class="userbg" id="userbg"></div>
<div class="glow"><div class="orb a"></div><div class="orb b"></div></div>

<span id="edit-slot"></span>

<button class="fab" id="fab" type="button" title="外观设置（仅本机浏览时生效，不会改服务端默认）">⚙</button>

<div class="panel" id="panel" role="dialog" aria-label="外观设置">
  <div class="p-sec">
    <div class="p-title">外观模式</div>
    <div class="seg" data-group="mode">
      <button type="button" data-v="auto">自动</button>
      <button type="button" data-v="light">亮色</button>
      <button type="button" data-v="dark">暗色</button>
    </div>
  </div>
  <div class="p-sec">
    <div class="p-title">主题色系 <span class="hint">随模式联动</span></div>
    <div class="themes" id="themes"></div>
  </div>
  <div class="p-sec">
    <div class="p-title">卡片尺寸</div>
    <div class="seg" data-group="size">
      <button type="button" data-v="s">小</button>
      <button type="button" data-v="m">中</button>
      <button type="button" data-v="l">大</button>
    </div>
  </div>
  <button class="p-reset" id="reset" type="button" title="清除本机选择，回到面板里保存的默认外观">↺ 跟随面板默认</button>
</div>

<div class="wrap">
  <header>
    <div class="clock" id="clock"></div>
    <h1 id="nav-title">导航页</h1>
    <div class="sub" id="subtitle">ZizPanel · 自托管首页</div>
    <div class="search">
      <span aria-hidden="true">🔍</span>
      <input id="search" type="search" placeholder="搜索名称 / 描述 / 网址…" autocomplete="off">
    </div>
  </header>

  <main id="app">
    <div class="empty"><div class="big">⏳</div><p>正在读取导航数据…</p></div>
  </main>

  <footer>只读页面 · 编辑请登录 ZizPanel 面板的「导航页」· 右上角 ⚙ 只改本机浏览外观</footer>
</div>

<script type="module" src="./nav.js"></script>
</body>
</html>
