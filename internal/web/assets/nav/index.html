<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>导航页 · ZizPanel</title>
<!--
  独立别名页（浏览器首页）：GET /nav/

  为什么这份页面是**自包含**的（自带样式，不引用面板的 /js/ui.js 与 /app.css）：
  它注册在面板安全后缀**之外**（外层 mux，见 internal/web/api_nav.go），
  匿名访问者拿不到后缀之下的任何资源 —— 引用面板资源会导致未登录时白屏。
  这里的配色刻意与 app.css 的变量取值保持一致，跟随同一个 data-theme 与
  localStorage['zp-theme']，所以在直连面板端口时明暗主题与面板同步；
  经 nginx 80 端口访问时属于另一个 origin，读不到面板的 localStorage，
  此时按系统主题（prefers-color-scheme）渲染 —— 这是如实的行为，不是缺陷。
-->
<style>
  :root {
    --bg: #0f1116; --panel: #1b1f2a; --panel-2: #212635; --border: #2b3142;
    --border-soft: #232838; --text: #e6e9f0; --text-dim: #9aa3b5; --text-mute: #6b7484;
    --brand: #3b82f6; --brand-soft: rgba(59,130,246,.14); --ok: #22c55e;
    --radius: 10px; --shadow: 0 6px 24px rgba(0,0,0,.28);
  }
  :root[data-theme="light"] {
    --bg: #f4f6fa; --panel: #ffffff; --panel-2: #f7f9fc; --border: #e2e6ee;
    --border-soft: #edf0f5; --text: #1a1f2b; --text-dim: #5b6472; --text-mute: #8b93a1;
    --brand-soft: rgba(59,130,246,.1); --shadow: 0 4px 18px rgba(16,24,40,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(900px 460px at 10% -12%, var(--brand-soft), transparent 60%),
      radial-gradient(700px 420px at 105% 110%, rgba(124,58,237,.10), transparent 60%);
    background-attachment: fixed;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 30px 20px 60px; }
  header.nav-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark {
    width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    background: linear-gradient(145deg, var(--brand), #7c3aed); color: #fff; font-weight: 700; font-size: 19px;
  }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .2px; }
  .brand p { margin: 1px 0 0; font-size: 11.5px; color: var(--text-mute); }
  .spacer { flex: 1; }
  .search {
    width: 100%; max-width: 340px; padding: 9px 13px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; color: inherit; font: inherit; outline: none;
  }
  .search:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .edit-link {
    font-size: 12.5px; color: var(--text-dim); text-decoration: none;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; background: var(--panel);
  }
  .edit-link:hover { color: var(--text); border-color: var(--text-mute); text-decoration: none; }
  section.group { margin-bottom: 26px; }
  .group-head { display: flex; align-items: center; gap: 9px; margin: 0 0 11px; }
  .group-head h2 { margin: 0; font-size: 14px; font-weight: 620; }
  .group-head .count { font-size: 11.5px; color: var(--text-mute); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  a.card {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px; min-height: 68px;
    background: linear-gradient(180deg, var(--panel), color-mix(in srgb, var(--panel) 94%, var(--bg)));
    border: 1px solid var(--border); border-radius: var(--radius);
    color: inherit; text-decoration: none;
    transition: transform .16s ease, box-shadow .18s ease, border-color .18s ease;
  }
  a.card:hover {
    transform: translateY(-2px); box-shadow: var(--shadow); text-decoration: none;
    border-color: color-mix(in srgb, var(--border) 62%, var(--brand));
  }
  .icon { width: 34px; height: 34px; flex: 0 0 auto; display: grid; place-items: center; font-size: 21px; border-radius: 9px; background: var(--panel-2); object-fit: contain; }
  img.icon { background: transparent; }
  .meta { min-width: 0; }
  .name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc { font-size: 11.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { text-align: center; padding: 70px 20px; color: var(--text-mute); }
  .empty .big { font-size: 38px; opacity: .6; margin-bottom: 10px; }
  .empty h3 { margin: 0 0 6px; color: var(--text-dim); font-size: 15px; }
  .empty p { margin: 0; font-size: 12.5px; }
  .foot { margin-top: 40px; text-align: center; font-size: 11.5px; color: var(--text-mute); }
  @media (max-width: 560px) {
    .wrap { padding: 20px 14px 40px; }
    .grid { grid-template-columns: 1fr; }
    .search { max-width: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="nav-head">
      <div class="brand">
        <div class="mark">Z</div>
        <div>
          <h1 id="nav-title">导航页</h1>
          <p id="subtitle">ZizPanel · 自托管首页</p>
        </div>
      </div>
      <div class="spacer"></div>
      <input id="search" class="search" type="search" placeholder="搜索名称 / 描述 / 网址…" autocomplete="off">
      <span id="edit-slot"></span>
    </header>
    <main id="app">
      <div class="empty"><div class="big">⏳</div><p>正在读取导航数据…</p></div>
    </main>
    <div class="foot">只读页面 · 编辑请登录 ZizPanel 面板的「导航页」</div>
  </div>
  <script type="module" src="./nav.js"></script>
</body>
</html>
